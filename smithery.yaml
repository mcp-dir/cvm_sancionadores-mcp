# Smithery configuration for CVM: Processos Sancionadores Julgados
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_cvm_sancionadores

name: cvm_sancionadores-mcp
displayName: "CVM: Processos Sancionadores Julgados"
description: >
  CVM: Processos Sancionadores Julgados, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/cvm_sancionadores-mcp
repository: https://github.com/mcp-dir/cvm_sancionadores-mcp

tags:
  - cvm_sancionadores
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_cvm_sancionadores

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_cvm_sancionadores/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
